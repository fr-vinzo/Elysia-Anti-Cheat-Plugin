# ============================================================
#  Elysia Anti-Cheat — Configuration v2
# ============================================================

general:
  debug: false
  prefix: "&8[&6Elysia AC&8]&r"
  log-violations: true

punishments:
  kick-threshold: 20
  # {check} est remplacé automatiquement par le nom du check déclencheur
  kick-message: |
    &c&lElysia Anti-Cheat
    &7Tu as été expulsé pour comportement suspect.
    &7Si tu penses que c'est une erreur, contacte le staff.
  alert-threshold: 5
  violation-decay-rate: 2
  violation-decay-interval: 60

# ============================================================
#  Checks — Mouvement
# ============================================================
checks:
  speed:
    enabled: true
    tolerance: 1.35
    alert-vl: 8
    kick-vl: 20

  fly:
    enabled: true
    airtime-threshold: 25
    alert-vl: 6
    kick-vl: 15

  no-fall:
    enabled: true
    min-fall-distance: 4.0
    alert-vl: 5
    kick-vl: 12

  timer:
    enabled: true
    # Paquets de mouvement max par seconde (vanilla ~20, Timer hack ~40+)
    max-packets-per-second: 24
    alert-vl: 8
    kick-vl: 20

  step:
    enabled: true
    # Hauteur max d'une marche en un tick (vanilla escalier = 0.625)
    max-step-height: 0.65
    alert-vl: 6
    kick-vl: 15

  fast-ladder:
    enabled: true
    # Vitesse max sur une échelle/liane (blocs/tick)
    max-speed: 0.13
    alert-vl: 5
    kick-vl: 12

  jesus:
    enabled: true
    # Ticks consécutifs sur l'eau avant flag
    min-ticks: 5
    alert-vl: 6
    kick-vl: 15

  # ============================================================
  #  Checks — Combat
  # ============================================================
  kill-aura:
    enabled: true
    max-cps: 18
    max-angle: 90.0
    max-targets-per-tick: 2
    alert-vl: 7
    kick-vl: 18

  reach:
    enabled: true
    max-reach: 5.0
    alert-vl: 6
    kick-vl: 15

  velocity:
    enabled: true
    # Pourcentage minimum du recul attendu que le joueur doit subir
    min-knockback-percent: 40
    alert-vl: 8
    kick-vl: 20

  autoclicker:
    enabled: true
    # Coefficient de variation minimum (%) des intervalles entre frappes
    # Humain : ~20-40%, AutoClicker : <10%
    min-coefficient-variation: 12.0
    # CPS minimum pour activer ce check
    min-cps-to-check: 4
    alert-vl: 7
    kick-vl: 18

  aimbot:
    enabled: true
    # Angle moyen maximum de visée (degrés) sur les dernières frappes
    # Humain : 5-20°, AimBot : <2°
    max-avg-angle: 3.0
    # Nombre de frappes minimum avant d'évaluer
    min-samples: 10
    alert-vl: 8
    kick-vl: 20

  fast-bow:
    enabled: true
    # Intervalle minimum entre deux tirs en ms (arc plein : 1000ms)
    min-interval-ms: 400
    alert-vl: 5
    kick-vl: 12

  # ============================================================
  #  Checks — Monde
  # ============================================================
  xray:
    enabled: true
    suspicious-ratio: 0.15
    flag-ratio: 0.28
    min-blocks-mined: 50
    time-window: 300
    alert-vl: 5
    kick-vl: 12

  fast-place:
    enabled: true
    # Blocs posés max par seconde
    max-per-second: 12
    alert-vl: 6
    kick-vl: 15

  scaffold:
    enabled: true
    # Blocs consécutifs sous soi en mouvement avant flag
    min-consecutive: 10
    alert-vl: 7
    kick-vl: 18

  nuker:
    enabled: true
    # Dispersion max (blocs) entre les positions des blocs cassés récents
    # 6.5 = couvre une pioche 5x5 légitime (diagonale ~5.66), au-dessus = nuker
    max-spread: 6.5
    # Nombre minimum de blocs cassés avant d'évaluer
    min-breaks: 8
    # Fenêtre de temps en ms (les blocs cassés hors de cette fenêtre sont ignorés)
    time-window-ms: 300
    alert-vl: 7
    kick-vl: 15

  instabreak:
    enabled: true
    # Dureté minimale du bloc pour activer le check
    min-hardness: 1.5
    alert-vl: 6
    kick-vl: 15

# ============================================================
#  Anti-XRay / Obfuscation
# ============================================================
anti-xray:
  enabled: true
  # Rayon de chunks adjacents à obfusquer (anti-bypass border)
  obfuscation-radius: 1
  replacement-block: STONE
  max-y: 16
  # Rayon de révélation quand un joueur mine (blocs)
  reveal-radius: 3
  fake-ores-on-suspect: true
  fake-ores-count: 30
  ore-types:
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - ANCIENT_DEBRIS
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE

# ============================================================
#  Base de données SQLite (historique persistant)
# ============================================================
database:
  enabled: false
  file: "violations.db"
  # Nombre max d'entrées conservées par joueur
  max-records-per-player: 100

# ============================================================
#  Intégration Discord
# ============================================================
discord:
  enabled: false
  # URL du webhook Discord (Settings → Intégrations → Webhooks)
  webhook-url: ""
  # VL minimum pour envoyer une alerte Discord
  min-vl: 10
  # true = envoyer uniquement les kicks sur Discord
  kicks-only: false
